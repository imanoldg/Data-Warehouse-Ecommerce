name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OLIST_DIR: ../data/muestra # datos sinteticos: el dataset real no se sube al repositorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

      - name: Generar datos de ejemplo
        run: python scripts/generar_muestra.py

      - name: dbt build (snapshot + modelos + tests de datos + unit tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: SCD tipo 2 - los vendedores cambian de sede y se historifican
        run: |
          python scripts/simular_cambios.py --dir data/muestra --porcentaje 10
          cd dbt
          dbt snapshot --profiles-dir .
          dbt build --profiles-dir . --exclude resource_type:snapshot

      - name: Tests de Python (incluidas las consultas del dashboard)
        run: pytest -v

      - name: Documentacion de dbt
        working-directory: dbt
        run: |
          dbt docs generate --profiles-dir . --static
          mkdir -p ../site && cp target/static_index.html ../site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # Publica la documentacion de dbt en GitHub Pages (solo desde main).
  # Requiere activarlo una vez: Settings > Pages > Source: GitHub Actions.
  docs:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
